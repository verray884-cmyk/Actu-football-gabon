services:
  - type: web
    name: votre-app-laravel
    env: php

    buildCommand: |
      composer install --no-dev --optimize-autoloader
      php artisan config:clear
      php artisan route:clear

    # ⚠️ Très important : PAS DE startCommand
    # Render lance automatiquement NGINX + PHP-FPM

    envVars:
      - key: PHP_EXTENSIONS
        value: pdo_mysql
